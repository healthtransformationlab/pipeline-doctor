[project]
name = "pipeline-doctor"
version = "0.3.0"
description = "DataOps for data pipelines: four metadata tables, a rules-first remediation ladder, graduation to automatic, and an ablation that shows what each table buys."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "John Bowyer"}]
dependencies = ["pandas>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/healthtransformationlab/pipeline-doctor"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
